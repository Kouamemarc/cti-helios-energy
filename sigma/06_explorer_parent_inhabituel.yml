title: explorer.exe démarré par un processus parent inhabituel
id: 64b6c6fa-84d5-40d9-8316-8ea1a479f67b
status: experimental
description: |
    Détecte un explorer.exe lancé par un parent autre que les processus d'ouverture de session.
    Le creux de processus de BIN-02 suppose de créer un explorer.exe pour y remplacer le code
    (alerte 8 : région mémoire exécutable anormale dans explorer.exe sur srv-fichiers-02).
references:
    - Dossier d'artefacts SOC Helios Energy, INC-2026-0302 - alerte SIEM 8, indicateur n°11, fiche BIN-02
author: Cellule CTI - projet Helios Energy
date: 2026-10-09
tags:
    - attack.stealth
    - attack.privilege-escalation
    - attack.t1055.012
    - tlp.amber
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\explorer.exe'
    filter_legit_parent:
        ParentImage|endswith:
            - '\userinit.exe'
            - '\winlogon.exe'
            - '\explorer.exe'
            - '\svchost.exe'
            - '\sihost.exe'
            - '\RuntimeBroker.exe'
            - '\taskmgr.exe'
    condition: selection and not filter_legit_parent
falsepositives:
    - Outils d'administration ou de personnalisation du bureau qui relancent l'explorateur
    - Scripts d'ouverture de dossier (explorer.exe appelé par cmd.exe) ; à ajuster après une période d'observation
level: medium
