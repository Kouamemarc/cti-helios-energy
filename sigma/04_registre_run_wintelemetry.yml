title: Persistance par clé Run nommée WinTelemetry
id: 6b59a076-86c3-4383-8543-c758e2b8ec0a
status: experimental
description: |
    Détecte l'écriture de la valeur WinTelemetry dans une clé Run du registre, persistance posée par BIN-01
    sur comptabilite-07. Aucun composant Windows légitime n'utilise ce nom de valeur.
references:
    - Dossier d'artefacts SOC Helios Energy, INC-2026-0302 - indicateur n°38, fiche BIN-01
author: Cellule CTI - projet Helios Energy
date: 2026-10-09
tags:
    - attack.persistence
    - attack.t1547.001
    - tlp.amber
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|endswith: '\Software\Microsoft\Windows\CurrentVersion\Run\WinTelemetry'
    condition: selection
falsepositives:
    - Aucun attendu
level: high
