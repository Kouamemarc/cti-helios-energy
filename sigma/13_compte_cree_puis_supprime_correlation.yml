title: Compte créé puis supprimé en moins d'une heure
id: b3383aa6-78ba-48f9-87cd-a95db340e033
status: experimental
description: |
    Détecte un compte créé puis supprimé dans l'heure, quel que soit son nom.
    Version générique de la règle 09 : svc-backup-temp a vécu 45 minutes sur dc-01.
references:
    - Dossier d'artefacts SOC Helios Energy, INC-2026-0302 - alerte SIEM 9, indicateur n°37
author: Cellule CTI - projet Helios Energy
date: 2026-10-09
tags:
    - attack.persistence
    - attack.t1136.002
    - attack.stealth
    - attack.t1070
    - tlp.amber
correlation:
    type: temporal_ordered
    rules:
        - compte_cree
        - compte_supprime
    group-by:
        - TargetUserName
    timespan: 1h
falsepositives:
    - Comptes de test créés et supprimés par les administrateurs
level: high
