title: Création ou suppression du compte svc-backup-temp
id: 3c287a0c-1072-4cb6-9945-31437ed258b9
status: experimental
description: |
    Détecte la création (4720) ou la suppression (4726) du compte de service éphémère utilisé par l'attaquant
    sur dc-01 : créé à 14:10, supprimé à 14:55 le 5 mars 2026.
    La version générique (tout compte créé puis supprimé en moins d'une heure) est fournie dans la règle 13.
references:
    - Dossier d'artefacts SOC Helios Energy, INC-2026-0302 - alerte SIEM 9, indicateur n°37
author: Cellule CTI - projet Helios Energy
date: 2026-10-09
tags:
    - attack.persistence
    - attack.t1136.002
    - attack.stealth
    - attack.t1070
    - tlp.amber
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID:
            - 4720
            - 4726
        TargetUserName: 'svc-backup-temp'
    condition: selection
falsepositives:
    - Aucun attendu, ce nom de compte n'existe pas dans le référentiel de l'entreprise
level: high
